# Cloudflare Worker (Static Assets) config for kaalsarpdoshpujaujjain.com.
# Live site = Worker "ksd" (created 2026-05-17), custom domain bound to it.
# Pure static Astro build (no adapter) → serve dist/ as Workers static assets.
# Deploy:  npm run deploy   (= astro build && wrangler deploy)
name = "ksd"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
