name: Deploy to Cloudflare Pages

# Reliable replacement for the broken CF dashboard Git-integration.
# Builds the Astro site and deploys dist/ to Cloudflare Pages on every push to main.
# Manual run also available from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # CF_PAGES_PROJECT repo variable overrides; falls back to "ksd".
          # Confirm the exact name with:  wrangler pages project list
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'ksd' }} --branch=main
