name: Deploy to Cloudflare Worker

# Reliable replacement for the broken CF dashboard Git-integration.
# Live site = Worker "ksd" (static assets, see wrangler.toml). Builds the Astro
# site and deploys dist/ to the worker on every push to main.
# Manual run also available from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Worker (ksd)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Worker name + assets dir come from wrangler.toml (name = "ksd").
          command: deploy
